services:
  stats-server:
    build: stats-service
    image: stats-server
    container_name: stats-server
    ports:
      - "9090:9090"
    depends_on:
      stats-db:
        condition: service_healthy
    environment:
      - SPRING_STATS_DATASOURCE_URL=jdbc:postgresql://stats-db:5432/explorestatsdb
      - SPRING_STATS_DATASOURCE_USERNAME=explorestatsuser
      - SPRING_STATS_DATASOURCE_PASSWORD=explorestats12345

  stats-db:
    image: postgres:16.1
    container_name: stats-db-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=explorestats12345
      - POSTGRES_USER=explorestatsuser
      - POSTGRES_DB=explorestatsdb
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  ewm-service:
    build: main-service
    image: ewm-service
    container_name: ewm-service
    ports:
      - "8080:8080"
    depends_on:
      ewm-db:
        condition: service_healthy
    environment:
      - SPRING_EWM_DATASOURCE_URL=jdbc:postgresql://ewm-db:5432/exploreewmdb
      - SPRING_EWM_DATASOURCE_USERNAME=exploreewmuser
      - SPRING_EWM_DATASOURCE_PASSWORD=exploreewm12345

  ewm-db:
    image: postgres:16.1
    container_name: ewm-db-postgres
    ports:
      - "5431:5432"
    environment:
      - POSTGRES_PASSWORD=exploreewm12345
      - POSTGRES_USER=exploreewmuser
      - POSTGRES_DB=exploreewmdb
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
