services:
  stats-service:
    build: stats-service
    image: stats-service
    container_name: stats-service
    ports:
      - "9090:9090"

  stats-db:
    image: postgres:16.1
    container_name: stats-db-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=explorestats12345
      - POSTGRES_USER=explorestatsuser
      - POSTGRES_DB=explorestatsdb
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
  
  stats-db-init:
    image: postgres:16.1
    container_name: stats-db-init
    depends_on:
      stats-db:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        set -e
        psql postgresql://explorestatsuser:explorestats12345@stats-db:5432/explorestatsdb -v ON_ERROR_STOP=1 <<-EOSQL
          CREATE TABLE IF NOT EXISTS hits (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY,
            app VARCHAR(512) NOT NULL,
            uri VARCHAR(512) NOT NULL,
            ip VARCHAR(256) NOT NULL,
            datetime TIMESTAMP WITHOUT TIME ZONE NOT NULL,
            CONSTRAINT pk_hits PRIMARY KEY (id)
          );
        EOSQL

  ewm-service:
    build: main-service
    image: ewm-service
    container_name: ewm-service
    ports:
      - "8080:8080"

